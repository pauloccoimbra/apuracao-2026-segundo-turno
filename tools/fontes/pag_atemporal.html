<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atemporal</title><meta name="description" content="Apuração atemporal do 2º turno de 2026: estados somados em sequência, na ordem escolhida, para separar o efeito da ordem de chegada do efeito do voto.">
<style>/*@CSS*/</style></head><body>
<header class="top"><div class="wrap">
 <div class="bar"><div class="brand">Apuração Atemporal · 2º turno<small>Presidente · ficção: estados somados em sequência, cada um apurado de forma homogênea</small></div>
 <div class="status" id="status"></div>
 <div class="ctrl"><a class="ext" href="evolucao.html">Evolução no tempo real</a><a class="ext" href="mapa.html">Mapa</a><a class="ext" href="https://resultados.tse.jus.br/oficial/app/index.html" target="_blank" rel="noopener">Site do TSE</a></div></div>
 <div class="scrub">
  <button id="play" type="button">Reproduzir</button>
  <span class="clock num" id="clock" style="min-width:70px">0%</span>
  <input type="range" id="slider" min="0" max="100" step="0.5" value="1" aria-label="Percentual dos votos do país apurado">
  <label class="since" for="pin">Ir para</label><input id="pin" class="pctin" type="number" min="0" max="100" step="0.1" value="1" aria-label="Percentual dos votos do país apurado">
  <label for="base" class="since">Base</label><select id="base"></select>
  <label for="ord" class="since">Ordem</label><select id="ord"></select>
  <label for="spd" class="since">Ritmo</label><select id="spd"><option value="2">2%/s</option><option value="5" selected>5%/s</option><option value="10">10%/s</option><option value="25">25%/s</option></select>
 </div></div></header>
<main class="wrap" id="main"></main>
<div class="tip" id="tip"></div>
<script>/*@DATA*/</script>
<script>/*@LIB*/</script>
<script>
'use strict';
const {UFS,ALLU,UFN,T0,$,esc,fi,fd,fp,fs,fsi,store,U1,U1vv,IL,IF,T1,D,pctSec,startLive,fin}=AP;
const ALL27=UFS;
const T50_1T=[["pr",72.1,"r"],["pb",74.3,"r"],["ac",84.4,"e"],["am",95.7,"r"],["go",97.5,"r"],["pi",98.8,"r"],["ro",101.4,"e"],["pa",102.5,"r"],["ms",103.4,"e"],["rr",103.7,"e"],["df",104.1,"e"],["mt",104.7,"e"],["to",108,"e"],["es",108.3,"e"],["sp",109.7,"r"],["ap",110,"e"],["rs",114,"e"],["rn",114.1,"r"],["sc",114.5,"e"],["se",114.5,"e"],["mg",117,"r"],["ma",121.2,"r"],["pe",124.9,"r"],["rj",128.6,"r"],["ba",130.1,"r"],["ce",131.5,"r"],["al",140.9,"r"]]; // minutos após 17h até 50% das seções no 1º turno (r = horários reais, e = estimada), referência de ordem
const COLF='var(--c2)',COLL='var(--c1)';
const ST={p:1,play:false,spd:5,ext:true,ord:store.get('ap26s.aord','1t'),base:store.get('ap26s.abase','um'),rev:false,r:store.get('ap26s.ar',72),s:store.get('ap26s.as',null),pf:1,ver:''};
const Eu=u=>{const x=U1(u);return U1vv(u)-x.v[IL]-x.v[IF]};
const sNeutro=(()=>T1.L/(T1.L+T1.F))();
if(ST.s==null)ST.s=Math.round(sNeutro*1000)/10;
/* ---------- bases de votos por UF: [Lula, Flávio] ---------- */
function obsUF(u){const d=D.pres[u];if(!d||!d.v.vv)return null;const p=pctSec(u),l=(fin(d,'13')||{vap:0}).vap,f=(fin(d,'22')||{vap:0}).vap;
  if(p>=.999)return{L:l,F:f,k:'final'};if(p>=.02)return{L:l/p,F:f/p,k:'projetado'};return null}
function hasObs(){return ALLU.some(u=>obsUF(u))}
function baseUF(u){
  const x=U1(u);
  if(ST.base==='obs'){const o=obsUF(u);if(o)return o}
  if(ST.base==='hip'||ST.base==='obs'){const r=ST.r/100,s=ST.s/100,E=Eu(u);return{L:x.v[IL]+r*E*s,F:x.v[IF]+r*E*(1-s),k:ST.base==='obs'?'hipótese (sem leitura)':'hipótese'}}
  return{L:x.v[IL],F:x.v[IF],k:'1º turno'};
}
/* ---------- ordens ---------- */
const t50obs=u=>{const H=AP.H;for(let i=0;i<H.t.length;i++){const r=H.u[i][u];if(r&&r[3]>=.5)return (H.t[i]-T0)/60000}return null};
const ORDERS={
 '1t':{n:'Ordem real do 1º turno (50% das seções)',f:us=>us.slice().sort((a,b)=>(T50_1T.find(x=>x[0]===a)||[0,999])[1]-(T50_1T.find(x=>x[0]===b)||[0,999])[1])},
 obs:{n:'Ordem observada no 2º turno (50% das seções)',f:us=>us.slice().sort((a,b)=>(t50obs(a)??9999)-(t50obs(b)??9999))},
 big:{n:'Maiores primeiro (votos)',f:us=>us.slice().sort((a,b)=>tv(b)-tv(a))},
 small:{n:'Menores primeiro (votos)',f:us=>us.slice().sort((a,b)=>tv(a)-tv(b))},
 flavio:{n:'Mais favoráveis a Flávio primeiro',f:us=>us.slice().sort((a,b)=>mg(b)-mg(a))},
 lula:{n:'Mais favoráveis a Lula primeiro',f:us=>us.slice().sort((a,b)=>mg(a)-mg(b))},
 alpha:{n:'Ordem alfabética',f:us=>us.slice().sort((a,b)=>UFN[a].localeCompare(UFN[b],'pt'))}
};
const BASES={um:'1º turno: só os votos de Lula e Flávio',hip:'Hipótese: 1º turno + ganho dos finalistas',obs:'Observada no 2º turno (final ou projetada)'};
let B={},ORD=[],SEG=[],N=0,TL=0,TF=0,PTS=[],SER=null,CH={};
const tv=u=>B[u].L+B[u].F, mg=u=>(B[u].F-B[u].L)/tv(u);
function build(){
  const us=ALLU.filter(u=>ST.ext||u!=='zz');B={};us.forEach(u=>B[u]=baseUF(u));
  let o=ORDERS[ST.ord].f(us);if(ST.rev)o=o.reverse();ORD=o;
  N=0;TL=TF=0;SEG=[];let c=0;
  for(const u of ORD){const v=tv(u);SEG.push({u,a:c,b:c+v,vv:v});c+=v;TL+=B[u].L;TF+=B[u].F}
  N=c;for(const s of SEG){s.pa=s.a/N*100;s.pb=s.b/N*100}
}
function at(p){const x=p/100*N;let L=0,F=0,cur=null;
  for(const s of SEG){if(x>=s.b){L+=B[s.u].L;F+=B[s.u].F}else if(x>s.a){const f=(x-s.a)/s.vv;L+=B[s.u].L*f;F+=B[s.u].F*f;cur={u:s.u,f};break}else break}
  return{L,F,x,cur,done:SEG.filter(s=>x>=s.b-1e-6).length}}
function series(){const set=new Set();for(let p=0;p<=100;p+=.25)set.add(+p.toFixed(2));SEG.forEach(s=>{set.add(+s.pa.toFixed(4));set.add(+s.pb.toFixed(4))});
  PTS=[...set].sort((a,b)=>a-b);const f=[],l=[],d=[];
  for(const p of PTS){const r=at(p||.0001),t=r.L+r.F;f.push(t?r.F/t*100:null);l.push(t?r.L/t*100:null);d.push(t?(r.F-r.L)/t*100:0)}
  SER={f,l,d}}
function chart(id,o){
  const W=760,H=o.h||280,pl=50,pr=14,pt=12,pb=30,iw=W-pl-pr,ih=H-pt-pb,X=p=>pl+p/100*iw,lo=o.ymin,hi=o.ymax,Y=v=>pt+(1-(v-lo)/(hi-lo))*ih;let g='';
  for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width=".7"/><text x="${pl-5}" y="${y+3.5}" text-anchor="end" font-size="10.5" fill="var(--muted)">${o.yf(v)}</text>`}
  for(let p=0;p<=100;p+=10)g+=`<text x="${X(p)}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${p}%</text>`;
  for(const s of SEG.slice(1))g+=`<line x1="${X(s.pa)}" x2="${X(s.pa)}" y1="${pt}" y2="${pt+ih}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 3"/>`;
  for(const h of o.hl||[])g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="${h.c||'var(--fg2)'}" stroke-dasharray="${h.d||'4 4'}" opacity=".8"/>`;
  for(const s of o.series){const d=s.ys.map((y,i)=>(i?'L':'M')+X(PTS[i]).toFixed(1)+' '+Y(y).toFixed(1)).join('');g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round"/>`}
  g+=`<line class="cur" x1="${X(ST.p)}" x2="${X(ST.p)}" y1="${pt}" y2="${pt+ih}" stroke="var(--fg)" opacity=".55"/><rect class="hit" x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/>`;
  CH[id]={W,pl,iw,X,tipf:o.tipf};return `<div class="chart" data-ch="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}</svg></div>`}
const pAt=(el,e)=>{const c=CH[el.dataset.ch],r=el.querySelector('svg').getBoundingClientRect();return Math.max(0,Math.min(100,((e.clientX-r.left)/r.width*c.W-c.pl)/c.iw*100))};
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('.chart[data-ch]'),tip=$('#tip');if(!el||!e.target.classList.contains('hit')){tip.style.display='none';return}const c=CH[el.dataset.ch];tip.innerHTML=c.tipf(+pAt(el,e).toFixed(1));tip.style.display='block';tip.style.left=Math.min(innerWidth-270,e.clientX+14)+'px';tip.style.top=e.clientY+14+'px'});
function setP(p){ST.p=Math.max(0,Math.min(100,p));$('#slider').value=ST.p;$('#pin').value=(+ST.p).toFixed(1).replace(/\.0$/,'');upd()}
function selects(){
  $('#ord').innerHTML=Object.entries(ORDERS).filter(([k])=>k!=='obs'||hasObs()).map(([k,v])=>`<option value="${k}"${k===ST.ord?' selected':''}>${v.n}</option>`).join('');
  $('#base').innerHTML=Object.entries(BASES).filter(([k])=>k!=='obs'||hasObs()).map(([k,v])=>`<option value="${k}"${k===ST.base?' selected':''}>${v}</option>`).join('');
}
function render(){
  if(ST.base==='obs'&&!hasObs())ST.base='um';if(ST.ord==='obs'&&!hasObs())ST.ord='1t';
  selects();build();series();
  const sum=TL+TF,fl=(TF-TL)/sum*100;
  const ch1=chart('c1',{series:[{c:COLF,ys:SER.f},{c:COLL,ys:SER.l}],hl:[{y:50,d:'2 4'}],ymin:Math.floor(Math.min(...SER.f,...SER.l,TF/sum*100,TL/sum*100)-2),ymax:Math.ceil(Math.max(...SER.f,...SER.l,TF/sum*100,TL/sum*100)+2),yf:v=>v.toFixed(0)+'%',tipf:p=>{const r=at(p),t=r.L+r.F;return `<b>${p}% dos votos do país</b>${r.cur?` · em ${r.cur.u.toUpperCase()}`:''}<br>Flávio Bolsonaro: ${fp(t?r.F/t*100:0)}<br>Lula: ${fp(t?r.L/t*100:0)}`},aria:'Percentual de Flávio Bolsonaro e Lula em função do percentual de votos do país apurado'});
  const dmax=Math.max(5,Math.ceil(Math.max(...SER.d.map(Math.abs),Math.abs(fl))/5)*5);
  const ch2=chart('c2',{series:[{c:'var(--fg)',ys:SER.d}],hl:[{y:0},{y:fl,c:'var(--good)'}],ymin:-dmax,ymax:dmax,yf:v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(0)+' p.p.',tipf:p=>{const r=at(p),t=r.L+r.F;return `<b>${p}%</b><br>Flávio Bolsonaro − Lula: ${fs(t?(r.F-r.L)/t*100:0)} p.p.`},aria:'Diferença entre Flávio Bolsonaro e Lula em pontos percentuais'});
  const strip=SEG.map(s=>`<button class="seg" data-u="${s.u}" style="width:${s.vv/N*100}%;background:color-mix(in srgb,${mg(s.u)>=0?COLF:COLL} ${Math.round(18+Math.min(55,Math.abs(mg(s.u))*100*1.1))}%,var(--surface2))" title="${esc(UFN[s.u])}: ${fp(s.pa,1)} a ${fp(s.pb,1)}"><b>${s.vv/N>.012?s.u.toUpperCase():''}</b><i data-f="${s.u}"></i></button>`).join('');
  const baseTxt={um:'Cada UF entra com os votos que Lula e Flávio Bolsonaro tiveram no 1º turno, sem os demais candidatos. Serve de régua neutra: mostra só o efeito da ordem sobre uma disputa entre os dois.',hip:`Cada UF entra com os votos do 1º turno de Lula e Flávio Bolsonaro mais ${fd(ST.r,0)}% dos votos dos demais candidatos, dos quais ${fd(ST.s,1)}% vão a Lula (valores ajustáveis abaixo). É uma hipótese de trabalho, não previsão.`,obs:'Cada UF entra com os votos lidos do TSE (final, se a UF concluiu a apuração) ou projetados pela fração de seções totalizadas; UFs sem leitura suficiente entram pela hipótese do 1º turno + ganho.'}[ST.base];
  const sl=ST.base!=='um'&&ST.base!=='obs'||ST.base==='obs'?`<div class="sliders" style="margin-top:10px"><label>Ganho dos finalistas entre os votos dos demais candidatos (r): <b id="rv">${fd(ST.r,0)}%</b><input type="range" id="rr" min="30" max="100" step="1" value="${ST.r}"></label><label>Parcela de Lula nesse ganho (s): <b id="sv">${fd(ST.s,1)}%</b><input type="range" id="ss" min="20" max="80" step=".5" value="${ST.s}"></label></div>`:'';
  $('#main').innerHTML=`<div class="callout" style="margin-bottom:14px"><b>Cenário fictício.</b> Os estados entram um de cada vez, na ordem escolhida, e cada estado é apurado de forma homogênea: os votos que entram têm sempre a composição do resultado do estado na base escolhida. O eixo mostra o % dos <b>votos de Lula e Flávio Bolsonaro no país</b> já somados (1% = ${fi(N/100)} votos). A ordem muda o caminho dos percentuais, mas todas chegam ao mesmo valor em 100%. <br><b>Base atual:</b> ${baseTxt}${ST.base==='hip'||ST.base==='obs'?sl:''}</div>
  <div id="inst"><div class="grid kpis"><div class="card kpi"><div class="lab">Votos somados</div><div class="big" data-k="p"></div><div class="det" data-k="pd"></div><div class="prog"><i data-k="bar"></i></div></div>
  <div class="card kpi"><div class="lab">Estados</div><div class="big" data-k="st"></div><div class="det" data-k="std"></div></div>
  <div class="card kpi"><div class="lab">Flávio Bolsonaro − Lula</div><div class="big num" data-k="m" style="font-size:22px"></div><div class="det" data-k="md"></div></div></div>
  <div class="card" style="margin-top:14px"><h2>Ordem em que os estados entram<span class="sub">largura = votos dos finalistas · cor: quem lidera na base · <label><input type="checkbox" id="rev"${ST.rev?' checked':''}> inverter</label> · <label><input type="checkbox" id="ext"${ST.ext?' checked':''}> incluir exterior</label></span></h2><div class="strip" id="strip">${strip}<span class="scur" id="scur"></span></div><div class="legend"><span><i class="sw" style="background:${COLF}"></i>Flávio Bolsonaro à frente</span><span><i class="sw" style="background:${COLL}"></i>Lula à frente</span></div><div class="note" id="snote"></div></div>
  <div class="card" style="margin-top:14px"><h2>Evolução do percentual de cada candidato<span class="sub">x: % dos votos somados · clique para ir ao ponto</span></h2>${ch1}<div class="legend"><span><i class="sw" style="background:${COLF}"></i>Flávio Bolsonaro</span><span><i class="sw" style="background:${COLL}"></i>Lula</span><span>linhas pontilhadas verticais: entrada de cada estado</span></div></div>
  <div class="grid two" style="margin-top:14px"><div class="card"><h2>Resultado nacional no ponto</h2><div class="res"><div class="row p4 head"><div>Candidato</div><div></div><div class="v">Votos</div><div class="p">Parcial</div><div class="proj">Final</div></div>
   <div class="row p4" data-i="F"><div class="nm"><span class="sw" style="background:${COLF}"></span><span class="t">Flávio Bolsonaro</span><small>PL 22</small></div><div class="trk"><i style="background:${COLF};width:0"></i></div><div class="v">0</div><div class="p">0%</div><div class="proj">${fp(TF/sum*100)}</div></div>
   <div class="row p4" data-i="L"><div class="nm"><span class="sw" style="background:${COLL}"></span><span class="t">Lula</span><small>PT 13</small></div><div class="trk"><i style="background:${COLL};width:0"></i></div><div class="v">0</div><div class="p">0%</div><div class="proj">${fp(TL/sum*100)}</div></div></div>
   <div class="note">Percentuais sobre Lula + Flávio Bolsonaro. Na base 1º turno, o total é inferior aos válidos da eleição, porque os demais candidatos ficam de fora.</div></div>
  <div class="card"><h2>Diferença Flávio Bolsonaro − Lula<span class="sub">pontos percentuais</span></h2>${ch2}<div class="legend"><span style="color:var(--good)">linha verde: valor final da base</span></div></div></div></div>
  <div class="card" style="margin-top:14px"><h2>Estados na ordem de entrada</h2><div class="tw"><table><thead><tr><th class="n">#</th><th>UF</th><th class="n">Votos (finalistas)</th><th class="n">Entra em</th><th class="n">Termina em</th><th class="n">Somado no estado</th><th class="n">Lula %</th><th class="n">Flávio %</th><th>Origem</th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
  upd();bindSl();
}
function upd(){
  const r=at(ST.p),sum=TL+TF,vs=r.L+r.F;$('#clock').textContent=(+ST.p).toFixed(1).replace('.',',').replace(',0','')+'%';
  const g=k=>document.querySelector(`[data-k=${k}]`);if(!g('p'))return;
  g('p').textContent=fp(ST.p,1).replace(',0%','%');g('pd').textContent=`${fi(r.x)} de ${fi(N)} votos`;g('bar').style.width=ST.p+'%';
  g('st').textContent=`${r.done} de ${SEG.length}`;g('std').textContent=r.cur?`em apuração: ${UFN[r.cur.u]} (${fp(r.cur.f*100,0)} do estado)`:(r.done===SEG.length?'todos concluídos':'nenhum estado iniciado');
  g('m').textContent=fsi(r.F-r.L);g('md').textContent=vs?`${fs((r.F-r.L)/vs*100)} p.p. dos votos somados`:'sem votos somados';
  document.querySelectorAll('.row[data-i]').forEach(e=>{const v=e.dataset.i==='F'?r.F:r.L;e.querySelector('.v').textContent=fi(v);const sh=vs?v/vs*100:0;e.querySelector('.p').textContent=vs?fp(sh):'–';e.querySelector('i').style.width=Math.min(100,sh)+'%'});
  document.querySelectorAll('[data-f]').forEach(e=>{const s=SEG.find(x=>x.u===e.dataset.f);e.style.width=Math.max(0,Math.min(1,(r.x-s.a)/s.vv))*100+'%'});
  const sc=$('#scur');if(sc)sc.style.left=ST.p+'%';
  $('#snote').textContent=r.cur?`Agora entrando: ${UFN[r.cur.u]}, com ${fp(r.cur.f*100,0)} dos seus votos já somados.`:'';
  $('#tb').innerHTML=SEG.map((s,i)=>{const f=Math.max(0,Math.min(1,(r.x-s.a)/s.vv)),b=B[s.u];return `<tr class="click${r.cur&&r.cur.u===s.u?' sel':''}" data-go="${s.pa}" style="cursor:pointer"><td class="n">${i+1}</td><td><b>${s.u.toUpperCase()}</b> ${esc(UFN[s.u])}</td><td class="n num">${fi(s.vv)}</td><td class="n num">${fp(s.pa,1)}</td><td class="n num">${fp(s.pb,1)}</td><td class="n num">${fp(f*100,0)}</td><td class="n num">${fp(b.L/s.vv*100)}</td><td class="n num">${fp(b.F/s.vv*100)}</td><td style="color:var(--muted)">${esc(b.k)}</td></tr>`}).join('');
  document.querySelectorAll('.cur').forEach(l=>{const c=CH[l.closest('.chart').dataset.ch];l.setAttribute('x1',c.X(ST.p));l.setAttribute('x2',c.X(ST.p))});
}
function bindSl(){
  const rr=$('#rr'),ss=$('#ss');
  if(rr)rr.oninput=e=>{ST.r=+e.target.value;store.set('ap26s.ar',ST.r);render()};
  if(ss)ss.oninput=e=>{ST.s=+e.target.value;store.set('ap26s.as',ST.s);render()};
}
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('.chart[data-ch]');if(el&&e.target.classList.contains('hit')){setP(+pAt(el,e).toFixed(1));return}
  const t=e.target.closest('[data-go]');if(t){setP(+t.dataset.go+.001);return}const sg=e.target.closest('.seg');if(sg){const s=SEG.find(x=>x.u===sg.dataset.u);setP(+(s.pa+(s.pb-s.pa)/2).toFixed(2))}});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='ext'){ST.ext=e.target.checked;render()}if(id==='rev'){ST.rev=e.target.checked;render()}
  if(id==='ord'){ST.ord=e.target.value;ST.rev=false;store.set('ap26s.aord',ST.ord);render()}
  if(id==='base'){ST.base=e.target.value;store.set('ap26s.abase',ST.base);render()}});
$('#slider').addEventListener('input',e=>{setP(+e.target.value);ST.pf=ST.p});
$('#pin').addEventListener('change',e=>{setP(+e.target.value||0);ST.pf=ST.p});
$('#spd').addEventListener('change',e=>ST.spd=+e.target.value);
let last=0;
function tk(ts){if(!ST.play)return;const dt=Math.min(.25,(ts-last)/1000);last=ts;ST.pf+=dt*ST.spd;if(ST.pf>=100){setP(100);stop();return}setP(+ST.pf.toFixed(1));requestAnimationFrame(tk)}
function stop(){ST.play=false;$('#play').textContent='Reproduzir'}
$('#play').addEventListener('click',()=>{if(ST.play){stop();return}if(ST.p>=100)setP(0);ST.pf=ST.p;ST.play=true;$('#play').textContent='Pausar';last=performance.now();requestAnimationFrame(tk)});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowRight')setP(ST.p+.5);if(e.key==='ArrowLeft')setP(ST.p-.5)});
AP.S.onUpdate=()=>{const v=ALLU.map(u=>D.pres[u]?Math.round(pctSec(u)*100):'-').join(',');if(v===ST.ver)return;ST.ver=v;if(ST.base==='obs'||hasObs()&&ST.ord==='obs'){if(!ST.play)render()}else selects()};
render();setP(1);startLive({pres:true,gov:false});
</script></body></html>
