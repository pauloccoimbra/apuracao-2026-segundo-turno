<style>/*@CSS*/</style></head><body>
<header class="top"><div class="wrap">
 <div class="bar"><div class="brand">Evolução · Apuração 2026 · 2º turno<small>Presidente · 2º turno · 25 de outubro · horário de Brasília</small></div>
 <div class="status" id="status"></div>
 <div class="ctrl"><a class="ext" href="painel.html" style="margin-right:12px">Painel em tempo real</a><a class="ext" href="atemporal.html" style="margin-right:12px">Cenário atemporal</a><a class="ext" href="mapa.html" style="margin-right:12px">Mapa</a><a class="ext" href="https://resultados.tse.jus.br/oficial/app/index.html" target="_blank" rel="noopener">Abrir site do TSE</a></div></div>
 <nav class="tabs" id="tabs" role="tablist"></nav>
 <label class="extopt" for="ext"><input type="checkbox" id="ext" checked><span><b>Incluir o exterior no total nacional</b><small>Vale para todas as abas desta página. Desmarcado, o total nacional soma só as 27 UFs.</small></span></label>

<script>/*@LIB*/</script>
<script>
'use strict';
const {UFS,ALLU,UFN,TILE,REGN,T0,$,$$,esc,fi,fd,fp,fs,fsi,fTimeM,store,U1,U1vv,IL,IF,T1,S:LS,startLive,codesCard,bindCodes,clearHist}=AP;
const ALL27=UFS;
const COLF='var(--c2)',COLL='var(--c1)';
const ST={tab:store.get('ap26s.etab','evo'),m:0,play:false,spd:5,uf:'sp',ext:true,swaps:[],sortKey:'t50',sortDir:1,follow:true,ver:''};
let M0=0,M1=0,HZ=240,G={},RF={},RL={},RV={},VF={},KEYS=0,CH={};
const fm=m=>fTimeM(T0+m*60000);
const fdur=m=>{const h=Math.floor(m/60),r=Math.round(m%60);return h?`${h}h${String(r).padStart(2,'0')}`:`${r} min`};
const sel=()=>ST.ext?ALLU:ALL27;
/* ---------- séries por UF a partir do histórico registrado ---------- */
function build(){
  const H=AP.H,n=H.t.length;
  if(!n){M0=M1=0;HZ=240;G={};KEYS=0;return}
  M0=Math.floor((H.t[0]-T0)/60000);M1=Math.ceil((H.t[n-1]-T0)/60000);if(M0<0)M0=0;
  HZ=Math.max(240,Math.ceil(M1/30)*30);
  G={};RL={};RF={};RV={};VF={};
  for(const u of ALLU){
    const g=new Float32Array(HZ+1),l=new Float32Array(HZ+1),f=new Float32Array(HZ+1),v=new Float32Array(HZ+1);
    let j=-1,any=false,first=-1;
    const idx=[];for(let i=0;i<n;i++)if(H.u[i][u])idx.push(i);
    if(idx.length){any=true;first=(H.t[idx[0]]-T0)/60000}
    for(let k=0;k<=HZ;k++){
      if(!any||k<first-1e-9){g[k]=l[k]=f[k]=v[k]=0;continue}
      const t=T0+k*60000;
      while(j+1<idx.length&&H.t[idx[j+1]]<=t)j++;
      const a=H.u[idx[Math.max(0,j)]][u];
      if(j<0||j>=idx.length-1){const r=H.u[idx[Math.max(0,Math.min(j,idx.length-1))]][u];l[k]=r[0];f[k]=r[1];v[k]=r[2];g[k]=r[3]}
      else{const b=H.u[idx[j+1]][u],ta=H.t[idx[j]],tb=H.t[idx[j+1]],w=tb>ta?(t-ta)/(tb-ta):0;
        l[k]=a[0]+(b[0]-a[0])*w;f[k]=a[1]+(b[1]-a[1])*w;v[k]=a[2]+(b[2]-a[2])*w;g[k]=a[3]+(b[3]-a[3])*w}
    }
    G[u]=g;RL[u]=l;RF[u]=f;RV[u]=v;
    // votos finais (ou projetados) da UF
    if(any){const r=H.u[idx[idx.length-1]][u],p=r[3];
      VF[u]=p>=.999?{L:r[0],F:r[1],kind:'final'}:p>=.02?{L:r[0]/p,F:r[1]/p,kind:'projetado'}:null}
  }
  // UFs sem dado suficiente: proporção nacional entre os finalistas aplicada aos válidos do 1º turno
  let sl=0,sf=0;for(const u of ALLU)if(VF[u]){sl+=VF[u].L;sf+=VF[u].F}
  const shL=sl+sf>0?sl/(sl+sf):.5;
  for(const u of ALLU)if(!VF[u]){const b=U1vv(u);VF[u]={L:b*shL,F:b*(1-shL),kind:'estimado'}}
  KEYS=n;
}
const clampM=m=>Math.max(0,Math.min(HZ,m));
const gAt=(u,m)=>{m=clampM(m);const k=Math.floor(m),f=m-k,a=G[u]?G[u][k]:0,b=G[u]?G[u][Math.min(HZ,k+1)]:0;return a+(b-a)*f};
function natAt(m,sigma){
  m=clampM(m);let L=0,F=0,vv=0,secs=0,secT=0;
  for(const u of sel()){
    secT+=U1(u).sec;
    if(!sigma){const k=Math.floor(m),f=m-k,k2=Math.min(HZ,k+1);
      L+=RL[u][k]+(RL[u][k2]-RL[u][k])*f;F+=RF[u][k]+(RF[u][k2]-RF[u][k])*f;vv+=RV[u][k]+(RV[u][k2]-RV[u][k])*f;secs+=gAt(u,m)*U1(u).sec}
    else{const s=sigma[u]||u,g=gAt(s,m);L+=g*VF[u].L;F+=g*VF[u].F;vv+=g*(VF[u].L+VF[u].F);secs+=g*U1(u).sec}
  }
  return{L,F,vv,secs,secT,pF:L+F>0?F/(L+F)*100:null,pL:L+F>0?L/(L+F)*100:null};
}
function finalNat(){let L=0,F=0;for(const u of sel()){L+=VF[u].L;F+=VF[u].F}return{L,F,pF:F/(L+F)*100,pL:L/(L+F)*100}}
const sigmaOf=sw=>{const s={};for(const [a,b] of sw){s[a]=b;s[b]=a}return s};
function tAt(u,fr){const g=G[u];if(!g)return null;for(let k=Math.max(1,M0);k<=HZ;k++)if(g[k]>=fr&&g[k-1]<fr)return k-1+(g[k]-g[k-1]>0?(fr-g[k-1])/(g[k]-g[k-1]):1);return g[HZ]>=fr&&g[M0]>=fr?null:null}
function peak(u){const g=G[u],sec=U1(u).sec;let best=0,at=0;for(let k=Math.max(5,M0+5);k<=M1;k++){const v=(g[k]-g[k-5])*sec/5;if(v>best){best=v;at=k-2.5}}return{v:best,at}}
const rank50=()=>ALL27.map(u=>({u,t:tAt(u,.5)})).filter(x=>x.t!=null).sort((a,b)=>a.t-b.t);
const kindOf=u=>VF[u]&&VF[u].kind;

/* ---------- gráfico ---------- */
function chart(id,o){
  const W=o.w||760,H=o.h||280,pl=o.mini?30:48,pr=o.mini?6:14,pt=o.mini?6:12,pb=o.mini?16:30,iw=W-pl-pr,ih=H-pt-pb;
  const X=m=>pl+m/HZ*iw;let lo=o.ymin,hi=o.ymax;
  if(lo==null||hi==null){let a=1e9,b=-1e9;for(const s of o.series)for(const y of s.ys)if(y!=null){a=Math.min(a,y);b=Math.max(b,y)}for(const h of o.hl||[]){a=Math.min(a,h.y);b=Math.max(b,h.y)}
    if(a>b){a=0;b=1}const pad=(b-a)*.08||1;lo=o.ymin??(a-pad);hi=o.ymax??(b+pad)}
  const Y=v=>pt+(1-(v-lo)/(hi-lo||1))*ih;let g='';const nt=o.mini?3:5;
  for(let i=0;i<=nt;i++){const v=lo+(hi-lo)*i/nt,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width=".7"/><text x="${pl-5}" y="${y+3.5}" text-anchor="end" font-size="${o.mini?9:10.5}" fill="var(--muted)">${o.yf(v)}</text>`}
  const step=o.mini?120:(HZ>300?60:30);
  for(let m=0;m<=HZ;m+=step)g+=`<text x="${X(m)}" y="${H-(o.mini?3:9)}" text-anchor="middle" font-size="${o.mini?9:10.5}" fill="var(--muted)">${fm(m)}</text>`;
  for(const h of o.hl||[])if(h.y>=lo&&h.y<=hi)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="${h.c||'var(--fg2)'}" stroke-dasharray="${h.d||'4 4'}" opacity=".8"/>${h.l&&!o.mini?`<text x="${W-pr-3}" y="${Y(h.y)-4}" text-anchor="end" font-size="10.5" fill="${h.c||'var(--fg2)'}">${esc(h.l)}</text>`:''}`;
  for(const s of o.series){let d='',pen=false;s.ys.forEach((y,m)=>{if(y==null||m<M0||m>M1){pen=false;return}d+=(pen?'L':'M')+X(m).toFixed(1)+' '+Y(y).toFixed(1);pen=true});
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||(o.mini?1.4:2)}" ${s.d?`stroke-dasharray="${s.d}"`:''} opacity="${s.op||1}" stroke-linejoin="round"/>`}
  g+=`<line class="cur" x1="${X(ST.m)}" x2="${X(ST.m)}" y1="${pt}" y2="${pt+ih}" stroke="var(--fg)" stroke-width="1" opacity=".55"/><rect class="hit" x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/>`;
  CH[id]={W,pl,iw,X,tipf:o.tipf};
  return `<div class="chart" data-ch="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'gráfico')}">${g}</svg></div>`;
}
const moveCursors=()=>$$('.chart[data-ch]').forEach(el=>{const c=CH[el.dataset.ch],l=el.querySelector('.cur');if(c&&l){const x=c.X(ST.m);l.setAttribute('x1',x);l.setAttribute('x2',x)}});
const chartM=(el,ev)=>{const c=CH[el.dataset.ch],r=el.querySelector('svg').getBoundingClientRect();return clampM(Math.round(((ev.clientX-r.left)/r.width*c.W-c.pl)/c.iw*HZ))};
const tip=$('#tip');
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('.chart[data-ch]');
  if(!el||!e.target.classList.contains('hit')){tip.style.display='none';return}
  const c=CH[el.dataset.ch];if(!c||!c.tipf){tip.style.display='none';return}
  tip.innerHTML=c.tipf(chartM(el,e));tip.style.display='block';tip.style.left=Math.min(innerWidth-270,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'});
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('.chart[data-ch]');if(el&&e.target.classList.contains('hit')){ST.follow=false;setM(chartM(el,e))}});

/* ---------- instante ---------- */
function setM(m){ST.m=Math.max(M0,Math.min(M1,Math.round(m*10)/10));$('#slider').value=Math.round(ST.m);inst();moveCursors()}
function header(){
  $('#ext').checked=ST.ext;
  $('#tabs').innerHTML=[['evo','Evolução'],['uf','Por estado'],['vel','Velocidade'],['troca','Trocas'],['met','Método e fontes']].map(([k,t])=>`<button role="tab" data-t="${k}" aria-selected="${ST.tab===k}">${t}</button>`).join('');
  $$('#tabs button').forEach(b=>b.onclick=()=>{ST.tab=b.dataset.t;store.set('ap26s.etab',ST.tab);render()});
  const sl=$('#slider');sl.min=M0;sl.max=Math.max(M0,M1);sl.value=Math.round(ST.m);
}
function tiles(){
  let h='';
  for(let r=0;r<8;r++)for(let c=0;c<7;c++){
    const u=Object.keys(TILE).find(k=>TILE[k][0]===c&&TILE[k][1]===r);
    if(!u){h+='<div class="tile empty"></div>';continue}
    h+=`<button class="tile${ST.uf===u?' sel':''}" data-u="${u}" title="${esc(UFN[u])}"><b>${u.toUpperCase()}</b><small data-p="${u}">0%</small><i style="width:0%"></i></button>`}
  return h;
}
function inst(){
  $('#clock').textContent=fm(ST.m);$('#since').textContent=KEYS?`${fdur(ST.m)} após as 17h`:'';
  const r=KEYS?natAt(ST.m):null,el=$('#inst');
  const fnl=KEYS?finalNat():null;
  if(el&&r){
    const q=r.secT?r.secs/r.secT*100:0,tot=r.L+r.F;
    el.querySelector('[data-k=sec]').textContent=fp(q,1);el.querySelector('[data-k=secd]').textContent=`${fi(r.secs)} de ${fi(r.secT)} seções`;el.querySelector('[data-k=bar]').style.width=q+'%';
    el.querySelector('[data-k=vot]').textContent=fi(tot);el.querySelector('[data-k=votd]').textContent=`${fp(tot/(fnl.L+fnl.F)*100,1)} dos votos válidos projetados`;
    el.querySelector('[data-k=lead]').textContent=tot?`${fs(r.pF-r.pL)} p.p.`:'–';
    el.querySelector('[data-k=leadd]').textContent=`${fsi(r.F-r.L)} votos agora · projeção final ${fs(fnl.pF-fnl.pL)} p.p. (positivo favorece Flávio)`;
    const rows={'22':[r.F,r.pF,fnl.pF],'13':[r.L,r.pL,fnl.pL]};
    for(const n in rows){const row=el.querySelector(`[data-n="${n}"]`);if(!row)continue;row.querySelector('.p').textContent=tot?fp(rows[n][1]):'–';row.querySelector('.v').textContent=fi(rows[n][0]);row.querySelector('.proj').textContent=fp(rows[n][2],1);row.querySelector('i').style.width=Math.min(100,rows[n][1]||0)+'%'}
    $$('#inst .tile').forEach(t=>{const u=t.dataset.u;if(!u)return;const p=gAt(u,ST.m)*100,k=Math.floor(clampM(ST.m)),l=RL[u][k],f=RF[u][k];t.querySelector('small').textContent=p.toFixed(0)+'%';t.querySelector('i').style.width=p+'%';
      t.style.background=l+f>0?`color-mix(in srgb,${f>=l?COLF:COLL} ${Math.round(18+Math.min(34,Math.abs(f-l)/(f+l)*100*1.3))}%,var(--surface2))`:''})}
  if($('#ufbox'))ufInst();
  $$('#veltab [data-g]').forEach(c=>c.textContent=fp(gAt(c.dataset.g,ST.m)*100,1));
}
const nodata=()=>`<div class="callout">Nenhuma leitura registrada ainda neste navegador. A página guarda cada leitura dos arquivos do TSE (a cada 30 a 120 s, conforme a configuração) e reconstitui a noite a partir delas; deixe esta página ou o Painel abertos durante a apuração. As leituras ficam só no seu navegador.</div>`;

/* ---------- abas ---------- */
function viewEvo(){
  if(!KEYS)return nodata();
  const xs=[],f=[],l=[],secs=[],mg=[];
  for(let m=0;m<=HZ;m++){if(m<M0||m>M1){f.push(null);l.push(null);secs.push(null);mg.push(null);continue}const r=natAt(m);const ok=r.secT&&r.secs/r.secT>=0.02;f.push(ok?r.pF:null);l.push(ok?r.pL:null);secs.push(r.secT?r.secs/r.secT*100:null);mg.push(ok?(r.F-r.L)/1000:null)}
  const fnl=finalNat();
  const tipN=m=>{const r=natAt(m);return `<b>${fm(m)}</b> · ${fp(r.secT?r.secs/r.secT*100:0,1)} das seções<br><span style="color:${COLF}">●</span> Flávio Bolsonaro: ${r.pF==null?'–':fp(r.pF)}<br><span style="color:${COLL}">●</span> Lula: ${r.pL==null?'–':fp(r.pL)}`};
  const all=[...f,...l].filter(x=>x!=null),ymin=Math.floor(Math.min(...all,fnl.pF,fnl.pL,50)-1),ymax=Math.ceil(Math.max(...all,fnl.pF,fnl.pL,50)+1);
  const c1=chart('nat',{series:[{c:COLF,ys:f},{c:COLL,ys:l}],hl:[{y:50,l:'50%',d:'2 4'},{y:fnl.pF,c:COLF,l:'projeção final Flávio'}],ymin,ymax,yf:v=>v.toFixed(0)+'%',tipf:tipN,aria:'Percentual de votos válidos de Flávio Bolsonaro e Lula ao longo da apuração'});
  const c2=chart('mg',{series:[{c:'var(--accent)',ys:mg}],hl:[{y:0,l:'empate',d:'2 4'}],yf:v=>v.toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil',tipf:m=>{const r=natAt(m);return `<b>${fm(m)}</b><br>Flávio − Lula: ${fsi(r.F-r.L)} votos`},aria:'Diferença de votos entre Flávio Bolsonaro e Lula'});
  const c3=chart('sec',{series:[{c:'var(--c5)',ys:secs}],hl:[{y:50,l:'50%',d:'2 4'}],ymin:0,ymax:100,yf:v=>v.toFixed(0)+'%',tipf:m=>{const r=natAt(m);return `<b>${fm(m)}</b><br>${fp(r.secs/r.secT*100,1)} das seções totalizadas`},aria:'Seções totalizadas ao longo do tempo'});
  let lead=null,ev=[];for(let m=M0;m<=M1;m++){if(f[m]==null)continue;const c=f[m]>l[m]?'22':'13';if(lead&&lead!==c)ev.push({m,c,s:Math.max(f[m],l[m])});lead=c}
  const rowH=(n,nm,sg,c)=>`<div class="row p4" data-n="${n}"><div class="nm"><span class="sw" style="background:${c}"></span><span class="t">${nm}</span><small>${sg} ${n}</small></div><div class="trk"><i style="background:${c}"></i></div><div class="v num"></div><div class="p num"></div><div class="proj num"></div></div>`;
  return `<div id="inst"><div class="grid kpis">
   <div class="card kpi"><div class="lab">Seções totalizadas</div><div class="big" data-k="sec"></div><div class="det" data-k="secd"></div><div class="prog"><i data-k="bar"></i></div></div>
   <div class="card kpi"><div class="lab">Votos válidos apurados</div><div class="big num" data-k="vot"></div><div class="det" data-k="votd"></div></div>
   <div class="card kpi"><div class="lab">Flávio Bolsonaro − Lula</div><div class="big" data-k="lead" style="font-size:20px"></div><div class="det" data-k="leadd"></div></div></div>
   <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>Resultado no instante<span class="sub">${ST.ext?'com':'sem'} exterior · leituras registradas</span></h2><div class="res"><div class="row p4 head"><div>Candidato</div><div></div><div class="v">Votos</div><div class="p">% válidos</div><div class="proj">Final proj.</div></div>${rowH('22','Flávio Bolsonaro','PL',COLF)}${rowH('13','Lula','PT',COLL)}</div>
     <div class="note">Soma das leituras registradas de cada UF no instante escolhido (sem supor homogeneidade). "Final proj." usa a projeção aritmética de cada UF com os dados mais recentes.</div></div>
    <div class="card"><h2>Apuração por UF<span class="sub">clique para abrir · cor = quem lidera</span></h2><div class="tiles big">${tiles()}</div></div></div></div>
   <div class="card" style="margin-top:14px"><h2>Evolução do percentual de votos válidos<span class="sub">clique no gráfico para ir ao instante</span></h2>${c1}<div class="legend"><span><i class="sw" style="background:${COLF}"></i>Flávio Bolsonaro</span><span><i class="sw" style="background:${COLL}"></i>Lula</span><span>tracejado: 50% e projeção final de Flávio</span></div>
    ${ev.length?`<div class="chips" style="margin-top:8px">${ev.slice(-8).map(e=>`<span class="chip">${fm(e.m)} · ${e.c==='22'?'Flávio Bolsonaro':'Lula'} assume a frente (${fp(e.s)})</span>`).join('')}</div>`:''}</div>
   <div class="grid two" style="margin-top:14px"><div class="card"><h2>Diferença de votos<span class="sub">Flávio Bolsonaro − Lula, em milhares</span></h2>${c2}</div><div class="card"><h2>Seções totalizadas<span class="sub">total nacional</span></h2>${c3}</div></div>`;
}
function viewUF(){
  if(!KEYS)return nodata();
  return `<div class="sim-ctrl"><label>Estado <select id="ufsel">${ALLU.map(u=>`<option value="${u}"${u===ST.uf?' selected':''}>${UFN[u]} (${u.toUpperCase()})</option>`).join('')}</select></label></div><div id="ufbox"></div>`;
}
function ufBox(){
  const u=ST.uf,sec=U1(u).sec,t=[.1,.5,.9,1].map(f=>tAt(u,f)),pk=peak(u),rk=rank50().findIndex(x=>x.u===u)+1;
  const gs=[],sh=[],sp=[];for(let m=0;m<=HZ;m++){gs.push(G[u][m]*100);const L=RL[u][m],F=RF[u][m];sh.push(L+F>0?F/(L+F)*100:null);const a=Math.max(0,m-2),b=Math.min(HZ,m+2);sp.push(m<M0+2||m>M1?null:(G[u][b]-G[u][a])*sec/(b-a||1))}
  const c1=chart('uf1',{series:[{c:'var(--accent)',ys:gs}],hl:[{y:50,l:'50%',d:'2 4'}],ymin:0,ymax:100,yf:v=>v.toFixed(0)+'%',tipf:m=>`<b>${fm(m)}</b><br>${fp(G[u][m]*100,1)} das seções`,aria:'Seções totalizadas na UF'});
  const c2=chart('uf2',{series:[{c:COLF,ys:sh}],hl:[{y:50,l:'50%',d:'2 4'}],yf:v=>v.toFixed(0)+'%',tipf:m=>{const L=RL[u][m],F=RF[u][m];return `<b>${fm(m)}</b><br>Flávio Bolsonaro: ${L+F>0?fp(F/(L+F)*100):'–'}`},aria:'Percentual de Flávio Bolsonaro nos votos válidos da UF'});
  const c3=chart('uf3',{series:[{c:'var(--c5)',ys:sp}],ymin:0,yf:v=>v.toFixed(0),tipf:m=>`<b>${fm(m)}</b><br>${(sp[m]||0).toFixed(0)} seções/min`,aria:'Velocidade de totalização'});
  const v=VF[u],tot=ALLU.reduce((a,x)=>a+VF[x].L+VF[x].F,0);
  return `<div class="grid kpis"><div class="card kpi"><div class="lab">${esc(UFN[u])} · ${kindOf(u)==='final'?'concluída':'em apuração'}</div><div class="big" data-uk="g"></div><div class="det" data-uk="gd"></div><div class="prog"><i data-uk="bar"></i></div></div>
   <div class="card kpi"><div class="lab">Metade das seções</div><div class="big">${t[1]!=null?fm(t[1]):'–'}</div><div class="det">${rk?`${rk}º mais rápido entre as UFs com leitura`:'ainda não alcançada'}</div></div>
   <div class="card kpi"><div class="lab">Concluída em</div><div class="big">${t[3]!=null?fm(t[3]):'–'}</div><div class="det">pico: ${pk.v.toFixed(0)} seções/min${pk.v?' às '+fm(pk.at):''} · ${fi(sec)} seções</div></div>
   <div class="card kpi"><div class="lab">Peso no total nacional</div><div class="big">${fp((v.L+v.F)/tot*100,1)}</div><div class="det">${fi(v.L+v.F)} votos válidos (${v.kind})</div></div></div>
   <div class="grid two" style="margin-top:14px"><div class="card"><h2>Seções totalizadas</h2>${c1}</div><div class="card"><h2>Votos já apurados na UF</h2><div class="res">
    <div class="row"><div class="nm"><span class="sw" style="background:${COLF}"></span><span class="t">Flávio Bolsonaro</span></div><div></div><div class="v num" data-vc="F"></div><div class="p num" data-vp="F"></div></div>
    <div class="row"><div class="nm"><span class="sw" style="background:${COLL}"></span><span class="t">Lula</span></div><div></div><div class="v num" data-vc="L"></div><div class="p num" data-vp="L"></div></div></div>
    <div class="note">Votos registrados nas leituras. A curva termina na última leitura.</div></div></div>
   <div class="grid two" style="margin-top:14px"><div class="card"><h2>Percentual de Flávio Bolsonaro nos válidos da UF</h2>${c2}</div><div class="card"><h2>Velocidade de totalização<span class="sub">seções por minuto</span></h2>${c3}</div></div>`;
}
function ufInst(){
  const b=$('#ufbox');if(!b||!b.querySelector('[data-uk=g]'))return;const u=ST.uf,p=gAt(u,ST.m)*100,k=Math.floor(clampM(ST.m)),L=RL[u][k],F=RF[u][k];
  b.querySelector('[data-uk=g]').textContent=fp(p,1);b.querySelector('[data-uk=gd]').textContent=`${fi(p/100*U1(u).sec)} de ${fi(U1(u).sec)} seções às ${fm(ST.m)}`;b.querySelector('[data-uk=bar]').style.width=p+'%';
  b.querySelector('[data-vc=F]').textContent=fi(F);b.querySelector('[data-vc=L]').textContent=fi(L);b.querySelector('[data-vp=F]').textContent=L+F>0?fp(F/(L+F)*100):'–';b.querySelector('[data-vp=L]').textContent=L+F>0?fp(L/(L+F)*100):'–';
}
function viewVel(){
  if(!KEYS)return nodata();
  const rk=rank50(),rows=ALLU.map(u=>{const pk=peak(u),t=[.1,.5,.9,1].map(f=>tAt(u,f)),r=rk.findIndex(x=>x.u===u)+1;return{u,rank:r||999,t10:t[0],t50:t[1],t90:t[2],t100:t[3],pk:pk.v,st:U1(u).sec,g:gAt(u,ST.m)*100,name:UFN[u],kind:kindOf(u)}});
  const k=ST.sortKey,dir=ST.sortDir;rows.sort((a,b)=>{const x=a[k]??1e9,y=b[k]??1e9;return(typeof x==='string'?x.localeCompare(y):x-y)*dir});
  const cols=[['rank','#'],['name','UF'],['g','No instante'],['t10','10%'],['t50','50%'],['t90','90%'],['t100','100%'],['pk','Pico seç./min'],['st','Seções']];
  const f=m=>m==null?'–':fm(m);
  const body=rows.map(r=>`<tr class="click" data-u="${r.u}" style="cursor:pointer"><td class="n">${r.rank===999?'–':r.rank}</td><td><b>${r.u.toUpperCase()}</b> ${esc(r.name)}</td><td class="n" data-g="${r.u}">${fp(r.g,1)}</td><td class="n">${f(r.t10)}</td><td class="n">${f(r.t50)}</td><td class="n">${f(r.t90)}</td><td class="n">${f(r.t100)}</td><td class="n">${r.pk?r.pk.toFixed(0):'–'}</td><td class="n">${fi(r.st)}</td></tr>`).join('');
  const all=ALLU.map(u=>({c:u===ST.uf?'var(--accent)':'var(--o)',w:u===ST.uf?2.6:1,op:u===ST.uf?1:.55,ys:Array.from(G[u],x=>x*100)}));
  const ch=chart('vel',{series:all,hl:[{y:50,l:'50%',d:'2 4'}],ymin:0,ymax:100,yf:v=>v.toFixed(0)+'%',tipf:m=>`<b>${fm(m)}</b><br>`+ALLU.map(u=>[u,G[u][m]*100]).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>`${x[0].toUpperCase()}: ${fp(x[1],1)}`).join('<br>')+'<br>…',aria:'Curvas de totalização por UF'});
  const mx=Math.max(1,...rk.map(x=>x.t));
  const bars=rk.map((x,i)=>`<div class="row" data-u="${x.u}" style="cursor:pointer"><div class="nm"><span class="t"><b>${i+1}.</b> ${x.u.toUpperCase()}</span><small>${esc(UFN[x.u])}</small></div><div class="trk"><i style="width:${x.t/mx*100}%;background:var(--accent)"></i></div><div class="v">${fm(x.t)}</div><div class="p"></div></div>`).join('');
  return `<div class="grid two"><div class="card"><h2>Curvas de totalização<span class="sub">UF selecionada em destaque (${ST.uf.toUpperCase()})</span></h2>${ch}</div>
   <div class="card"><h2>Ranking: hora em que cada UF passa de 50% das seções</h2><div class="res" style="max-height:420px;overflow:auto">${bars||'<div class="empty-msg">Nenhuma UF passou de 50% ainda.</div>'}</div></div></div>
   <div class="card" id="veltab" style="margin-top:14px"><h2>Velocidade por UF<span class="sub">clique no cabeçalho para ordenar, na linha para abrir</span></h2><div class="tw"><table><thead><tr>${cols.map(([c,t])=>`<th class="sortable${c==='name'?'':' n'}" data-s="${c}" style="cursor:pointer">${t}${k===c?(dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div></div>`;
}
function leadSeries(sg){const ys=[];for(let m=0;m<=HZ;m++){if(m<M0||m>M1){ys.push(null);continue}const r=natAt(m,sg);ys.push(r.pF==null?null:r.pF-r.pL)}return ys}
function viewTroca(){
  if(!KEYS)return nodata();
  const rk=rank50();if(rk.length<2)return `<div class="card prose"><h2>Trocas na dinâmica de apuração</h2><p>As trocas precisam de ao menos duas UFs que tenham passado de 50% das seções. Volte quando houver mais dados.</p></div>`;
  const fast=rk[0].u,slow=rk[rk.length-1].u,fnl=finalNat(),fl=fnl.pF-fnl.pL;
  const opts=ALL27.map(u=>`<option value="${u}">${esc(UFN[u])}</option>`).join('');
  const base=leadSeries(null),sw=leadSeries(sigmaOf(ST.swaps));
  const chips=ST.swaps.map((p,i)=>`<span class="chip">${p[0].toUpperCase()} ⇄ ${p[1].toUpperCase()}<button data-rm="${i}" aria-label="remover troca">×</button></span>`).join('')||'<span style="color:var(--muted)">nenhuma troca</span>';
  const ch=chart('troca',{series:[{c:'var(--fg2)',ys:base,d:'5 4',w:1.6},{c:'var(--accent)',ys:sw}],hl:[{y:0,l:'empate',d:'2 4'},{y:fl,c:'var(--good)',l:'projeção final'}],yf:v=>fs(v,1),tipf:m=>`<b>${fm(m)}</b><br>sem trocas: ${base[m]==null?'–':fs(base[m])} p.p.<br>com trocas: ${sw[m]==null?'–':fs(sw[m])} p.p.`,aria:'Diferença entre Flávio Bolsonaro e Lula com trocas de ritmo entre UFs'});
  return `<div class="card prose"><h2>Trocas na dinâmica de apuração<span class="sub">como no notebook de 2022</span></h2>
   <p>Cada troca faz a UF A apurar no ritmo da UF B (e vice-versa), mantendo seus votos finais (ou projetados). O gráfico mostra a diferença Flávio Bolsonaro − Lula, em pontos percentuais dos votos válidos, ao longo do tempo. A curva tracejada usa o mesmo modelo sem trocas. Serve para medir quanto da trajetória vem da <i>ordem de chegada</i> dos estados, e não do voto.</p>
   <div class="sim-ctrl"><button class="btn" id="preset">Trocar mais rápido ⇄ mais lento (${fast.toUpperCase()} ⇄ ${slow.toUpperCase()})</button> <select id="sa">${opts}</select> ⇄ <select id="sb">${opts.replace(`value="${ALL27[1]}"`,`value="${ALL27[1]}" selected`)}</select> <button class="btn" id="add">Adicionar troca</button> <button class="btn" id="clr">Limpar</button></div>
   <div class="chips" style="margin:10px 0">${chips}</div>${ch}
   <div class="legend"><span><i class="sw" style="background:var(--fg2)"></i>modelo sem trocas (tracejado)</span><span><i class="sw" style="background:var(--accent)"></i>com trocas</span></div>
   <div class="note">Modelo: nacional(t) = Σ g_UF(t) · votos finais da UF, com g a fração de seções totalizadas. Votos finais são os do último arquivo lido ou, se a UF ainda não terminou, a projeção aritmética. O exterior só entra se a caixa do topo estiver marcada.</div></div>`;
}
function viewMet(){
  return `<div class="card prose"><h2>Método</h2>
  <p>Para cada UF, a velocidade de apuração é a fração <code>g_UF(t)</code> de seções totalizadas ao longo do tempo. No 2º turno, essa curva vem das <b>leituras que o seu navegador registrou</b> dos arquivos públicos de divulgação do TSE (seções totalizadas e votos de Lula e Flávio Bolsonaro, por UF, a cada leitura). O resultado em cada instante é a soma, nas UFs, dos votos registrados naquele instante, com interpolação linear entre leituras.</p>
  <p>Na aba <b>Trocas</b>, o total nacional parcial usa o modelo do notebook de 2022: <code>Σ g_UF(t)·V_UF</code>, em que V_UF são os votos finais (ou projetados) da UF. Ele supõe votos homogêneos dentro da UF, o que é uma simplificação.</p>
  <h3>Limites</h3>
  <ul><li>As leituras só existem a partir do momento em que a página (Evolução ou Painel) foi aberta neste navegador; antes disso a linha do tempo fica em branco. Mantenha uma das duas abertas durante a apuração.</li>
  <li>A resolução é a do intervalo de leitura (30 a 120 s). Seções totalizadas entre duas leituras aparecem no ritmo médio do intervalo.</li>
  <li>O histórico fica em <code>localStorage</code>, limitado a 1.500 leituras. O botão abaixo o apaga.</li>
  <li>O TSE não publica o histórico minuto a minuto; uma reconstituição fiel exige coletar os horários de totalização das seções, como foi feito no 1º turno. Isso depende de arquivos que só existem após a apuração e está listado como pendente.</li></ul>
  <p><button class="btn" id="clh">Apagar histórico registrado neste navegador</button></p>
  <h3>Fontes</h3><ul class="src"><li><a class="ext" href="https://resultados.tse.jus.br/oficial/app/index.html" target="_blank" rel="noopener">Resultados TSE (oficial)</a>: arquivos públicos de divulgação de resultados.</li><li>Cálculos próprios; podem conter erros. Independente, sem vínculo com o TSE.</li></ul></div>`;
}
function render(){
  const y=scrollY;header();
  $('#view').innerHTML=ST.tab==='evo'?viewEvo():ST.tab==='uf'?viewUF():ST.tab==='vel'?viewVel():ST.tab==='troca'?viewTroca():viewMet();
  if(ST.tab==='uf'&&KEYS)$('#ufbox').innerHTML=ufBox();
  bind();inst();moveCursors();scrollTo(0,y);
}
function bind(){
  $$('#inst .tile').forEach(t=>t.onclick=()=>{ST.uf=t.dataset.u;ST.tab='uf';store.set('ap26s.etab','uf');render()});
  const us=$('#ufsel');if(us)us.onchange=e=>{ST.uf=e.target.value;render()};
  $$('#veltab th[data-s]').forEach(th=>th.onclick=()=>{const k=th.dataset.s;if(ST.sortKey===k)ST.sortDir=-ST.sortDir;else{ST.sortKey=k;ST.sortDir=k==='name'||k==='rank'||k.startsWith('t')?1:-1}render()});
  $$('#veltab tr[data-u], .res .row[data-u]').forEach(r=>r.onclick=()=>{ST.uf=r.dataset.u;ST.tab='uf';store.set('ap26s.etab','uf');render()});
  const pr=$('#preset');if(pr)pr.onclick=()=>{const rk=rank50();ST.swaps=[[rk[0].u,rk[rk.length-1].u]];render()};
  const ad=$('#add');if(ad)ad.onclick=()=>{const a=$('#sa').value,b=$('#sb').value;if(a!==b&&!ST.swaps.some(p=>p.includes(a)||p.includes(b))){ST.swaps.push([a,b]);render()}};
  const cl=$('#clr');if(cl)cl.onclick=()=>{ST.swaps=[];render()};
  $$('[data-rm]').forEach(b=>b.onclick=()=>{ST.swaps.splice(+b.dataset.rm,1);render()});
  const ch=$('#clh');if(ch)ch.onclick=()=>{clearHist();build();setM(0);render()};
}
$('#ext').onchange=e=>{ST.ext=e.target.checked;render()};
$('#slider').oninput=e=>{ST.follow=false;setM(+e.target.value)};
$('#spd').onchange=e=>{ST.spd=+e.target.value};
let pt=null;
$('#play').onclick=()=>{
  if(ST.play){ST.play=false;clearInterval(pt);$('#play').textContent='Reproduzir';return}
  if(ST.m>=M1-1)setM(M0);
  ST.play=true;ST.follow=false;$('#play').textContent='Pausar';
  pt=setInterval(()=>{const n=ST.m+ST.spd*.1;if(n>=M1){setM(M1);ST.play=false;clearInterval(pt);$('#play').textContent='Reproduzir'}else setM(n)},100)};
AP.S.onUpdate=()=>{
  const v=AP.H.t.length+'|'+(AP.H.t[AP.H.t.length-1]||0);
  if(v===ST.ver)return;ST.ver=v;
  const atEnd=ST.follow||ST.m>=M1-1;build();
  if(atEnd){ST.m=M1}
  ST.m=Math.max(M0,Math.min(M1,ST.m));
  if(!ST.play)render();
};
build();if(KEYS){ST.m=M1}
$('#codesbox').innerHTML=codesCard();bindCodes();
render();startLive({pres:true,gov:false});
addEventListener('resize',()=>{CH={};render()});
</script></body></html>
